const R=d=>d.where==='remote';
const SYNC='https://wohnung-og-5ecd2-default-rtdb.europe-west1.firebasedatabase.app';
const store={get(k,d){try{return JSON.parse(localStorage.getItem('werk_'+k))??d}catch(_){return d}},set(k,v){try{localStorage.setItem('werk_'+k,JSON.stringify(v))}catch(_){}}};
const nowLocal=()=>{const t=new Date();t.setMinutes(t.getMinutes()-t.getTimezoneOffset());return t.toISOString().slice(0,16)};
const prev=store.get('lastVisit',null);
const isGone=d=>!!d.gone_at;
const isNew=d=>prev&&d.first_seen>prev&&!isGone(d);
const isNewGone=d=>prev&&d.gone_at&&d.gone_at>prev;
// статусы хранятся в той же базе, что и квартиры (те же 4 слова), но подписи — про работу
const ST={'написали':{i:'✉️',b:'откликнулся'},'просмотр':{i:'📅',b:'собеседование'},'отказ':{i:'❌',b:'отказ'},'не интересно':{i:'✕',b:'не интересно'}};

const KCOL={'Web / Shop / SEO':'#42a5f5','KI / Automatisierung':'#ab47bc','Online-Marketing':'#ffb74d','Другое':'#bdbdbd'};
let marks={}, on=store.get('kinds',{'Web / Shop / SEO':1,'KI / Automatisierung':1,'Online-Marketing':1,'Другое':0}),
    opt=store.get('opt',{near:1,remote:1,c1:0,gone:0,'отказ':0,'не интересно':0}), minS=store.get('minS',2), age=store.get('age','все'), selId=null;
const today=new Date(nowLocal().slice(0,10));
const posted=d=>d.posted||(d.first_seen||'').slice(0,10);
const days=d=>Math.round((today-new Date(posted(d)))/864e5);
const ago=d=>{const n=days(d),p=posted(d).split('-'),dt=`${p[2]}.${p[1]}.${p[0].slice(2)}`;
  return n<=0?'🆕 выставлено сегодня':n===1?`выставлено вчера (${dt})`:`выставлено ${n} дн. назад (${dt})`};
const AGES={'все':1e5,'сегодня':0,'вчера':1,'3 дня':3,'неделя':7,'месяц':31};
const ageOk=d=>age==='все'||(age==='вчера'?days(d)===1:days(d)<=AGES[age]);

const useSync=SYNC&&!SYNC.startsWith('{{');
async function pull(){if(!useSync)return;try{const r=await fetch(SYNC+'/wohnung/marks.json',{cache:'no-store'});if(r.ok){const all=(await r.json())||{};

document.getElementById('syncinfo').textContent=useSync?'отметки общие':'отметки только на этом устройстве';

const map=L.map('map').setView(CENTER,7);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:18}).addTo(map);
L.circleMarker(CENTER,{radius:6,color:'#000',fillOpacity:1}).addTo(map).bindTooltip('Oberkirch');
L.circle(CENTER,{radius:75000,color:'#2962ff',weight:1,fillOpacity:.04}).addTo(map).bindTooltip('75 км — «рядом»');

const spot={};JOBS.forEach(d=>{if(!d.lat)return;const k=d.lat.toFixed(4)+','+d.lon.toFixed(4);const i=spot[k]=(spot[k]??-1)+1;
  const a=i*2.4,r=i?0.0012*Math.sqrt(i):0;d._lat=d.lat+r*Math.sin(a);d._lon=d.lon+r*Math.cos(a)*1.5});
const markers={};

function select(id,{scroll=true}={}){
  selId=id;const d=JOBS.find(x=>x.id===id);if(!d)return;
  document.querySelectorAll('.c.sel,.pin.sel').forEach(e=>e.classList.remove('sel'));

function setMark(id,m){marks[id]=marks[id]===m?undefined:m;if(!marks[id])delete marks[id];push(id);draw()}
function visible(d){return on[d.kind]&&(R(d)?opt.remote:opt.near)&&(d.de!=='C1+'||opt.c1)&&d.stars>=minS&&(!isGone(d)||opt.gone||isNewGone(d))&&(!HIDE.includes(marks[d.id])||opt[marks[d.id]])&&ageOk(d)}
function news(){
  const el=document.getElementById('news');

  el.innerHTML=(n||g)?`<div class="news"><button onclick="store.set('lastVisit',nowLocal());location.reload()">прочитано</button>С прошлого захода: <b>${n} новых</b> (★3+), закрыто ${g}.</div>`:'';
}
function draw(){
  Object.values(markers).forEach(m=>map.removeLayer(m));
  const list=document.getElementById('list');list.innerHTML='';

      m.bindTooltip(`${esc(d.title)}<br><small>${esc(d.firma)}</small>`);m.on('click',()=>select(d.id));markers[d.id]=m;}

        <div class="m"><span class="age${days(d)<=0?' fresh':''}">${ago(d)}</span> · <span class="dot" style="background:${KCOL[d.kind]}"></span> ${d.kind} · ${d.src}</div>
        ${d.desc?`<div class="m" style="margin-top:3px">${esc(d.desc.slice(0,200))}…</div>`:''}
        <div class="acts">${gone?'':Object.keys(ST).map(k=>`<button data-m="${k}" class="${mk===k?'on':''}">${ST[k].i} ${mk===k&&HIDE.includes(k)?'вернуть':ST[k].b}</button>`).join('')}<a href="${d.url}" target="_blank" style="font-size:12px">вакансия →</a></div>`;
      el.onclick=e=>{const b=e.target.closest('button');if(b){setMark(d.id,b.dataset.m);return}if(e.target.closest('a'))return;select(d.id,{scroll:false})};
      list.appendChild(el);

  });
  document.querySelectorAll('#df button').forEach(b=>{b.classList.toggle('on',b.dataset.a===age);

const f=document.getElementById('f');

[['near','📍 рядом',JOBS.filter(d=>!R(d)&&!isGone(d)).length],['remote','🏠 remote',JOBS.filter(d=>R(d)&&!isGone(d)).length],['c1','⚠ C1+',JOBS.filter(d=>d.de==='C1+'&&!isGone(d)).length],['gone','закрытые',JOBS.filter(isGone).length]].forEach(([k,t,n])=>
  f.insertAdjacentHTML('beforeend',`<label><input type="checkbox" data-o="${k}" ${opt[k]?'checked':''}>${t} ${n}</label>`));
HIDE.forEach(k=>f.insertAdjacentHTML('beforeend',`<label><input type="checkbox" data-o="${k}" ${opt[k]?'checked':''}>${ST[k].i} ${ST[k].b} <span id="cnt-${k.replace(' ','')}">0</span></label>`));
f.onchange=e=>{const t=e.target;if(t.dataset.k){on[t.dataset.k]=t.checked?1:0;store.set('kinds',on)}else{opt[t.dataset.o]=t.checked?1:0;store.set('opt',opt)}draw()};
f.insertAdjacentHTML('beforeend',`<label>от <select id="minS">${[1,2,3,4,5].map(n=>`<option ${n==minS?'selected':''}>${n}</option>`).join('')}</select> ★</label>`);
document.getElementById('minS').onchange=e=>{minS=+e.target.value;store.set('minS',minS);draw()};
const df=document.getElementById('df');
df.innerHTML='<span>Выставлено:</span>'+Object.keys(AGES).map(a=>`<button data-a="${a}">${a} <i></i></button>`).join('');
df.onclick=e=>{const b=e.target.closest('button');if(!b)return;age=b.dataset.a;store.set('age',age);draw()};
if(!prev)store.set('lastVisit',nowLocal());

</script></body></html>
