/* Фильтры — одинаковые на всех страницах работы (Оля, Никита, родители). Логика как в интернет-магазине:
   • каждая строка — один вопрос (где? какой тип? немецкий? …);
   • внутри строки выбранные пункты складываются («рядом» + «remote» = оба), между строками — пересекаются;
   • в строке ничего не выбрано = строка не мешает, показываем всё («все» подсвечено);
   • нажал пункт — включил, ещё раз — выключил; «все» — сбросить строку;
   • число на пункте = сколько вакансий будет на экране, если включить его (уже с учётом остальных строк);
     0 — пункт серый: с этим сочетанием ничего нет.
   Вставляется в шаблон вместо FACETS при сборке страницы (render в jobs.py / werk.py / eltern.py). */
function Facets({el, groups, items, store, onChange}) {
  if (!document.getElementById('fx-css')) document.head.insertAdjacentHTML('beforeend', `<style id="fx-css">
.fx-top{font-size:13px;margin:4px 0 8px;color:var(--ink)}.fx-top a{color:var(--sel);cursor:pointer;text-decoration:underline;margin-left:4px;font-size:12px}
.fx-g{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-bottom:6px;font-size:12px}
.fx-t{min-width:92px;color:var(--mute);font-size:12px}
.fx{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:3px 9px;cursor:pointer;display:inline-flex;gap:5px;align-items:center}
.fx i{font-style:normal;color:var(--mute)}.fx.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}.fx.on i{color:var(--bg);opacity:.75}
.fx.zero:not(.on){opacity:.4}.fx-all{font-size:12px;cursor:pointer;padding:3px 8px;border-radius:16px;border:1px dashed var(--line);color:var(--mute)}
.fx-all.on{border-style:solid;border-color:var(--ink);color:var(--ink);font-weight:600}</style>`);
  const e = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
  const saved = store.get('fx', null) || {};
  const S = {};
  groups.forEach(g => S[g.id] = new Set((saved[g.id] ?? g.def ?? []).filter(v => g.options.some(o => o.v === v))));
  const inG = (d, g) => !S[g.id].size || g.options.some(o => S[g.id].has(o.v) && o.test(d));
  const pass = (d, skip) => groups.every(g => g.id === skip || inG(d, g));
  const save = () => store.set('fx', Object.fromEntries(groups.map(g => [g.id, [...S[g.id]]])));
  const isDefault = () => groups.every(g => {const a = [...S[g.id]].sort().join('|'), b = [...(g.def || [])].sort().join('|'); return a === b});

  function render() {
    const all = items(), vis = all.filter(d => pass(d));
    let h = `<div class="fx-top">Показано <b>${vis.length}</b> из ${all.length}` +
      (isDefault() ? '' : ' <a data-reset="1">вернуть как было</a>') + (groups.some(g => S[g.id].size) ? ' <a data-clear="1">показать всё</a>' : '') + '</div>';
    groups.forEach(g => {
      const base = all.filter(d => pass(d, g.id));
      h += `<div class="fx-g"><span class="fx-t">${g.title}</span><a class="fx-all${S[g.id].size ? '' : ' on'}" data-all="${g.id}" title="не фильтровать по этой строке">все ${base.length}</a>`;
      g.options.forEach(o => {
        const n = base.filter(o.test).length, on = S[g.id].has(o.v);
        if (!n && !on && o.hideEmpty !== false && !all.some(o.test)) return;  // такого вообще нет в данных — не показываем
        h += `<button class="fx${on ? ' on' : ''}${n ? '' : ' zero'}" data-g="${g.id}" data-v="${e(o.v)}"${o.tip ? ` title="${e(o.tip)}"` : ''}>` +
             `${o.color ? `<span class="dot" style="background:${o.color}"></span>` : ''}${o.label} <i>${n}</i></button>`;
      });
      h += '</div>';
    });
    el.innerHTML = h;
  }
  el.onclick = ev => {
    const b = ev.target.closest('[data-g],[data-all],[data-reset],[data-clear]');
    if (!b) return;
    ev.preventDefault();
    if (b.dataset.g) {
      const g = groups.find(x => x.id === b.dataset.g), s = S[g.id], v = b.dataset.v;
      if (g.single) {const had = s.has(v); s.clear(); if (!had) s.add(v)} else s.has(v) ? s.delete(v) : s.add(v);
    } else if (b.dataset.all) S[b.dataset.all].clear();
    else if (b.dataset.reset) groups.forEach(g => S[g.id] = new Set(g.def || []));
    else groups.forEach(g => S[g.id].clear());
    save(); onChange();
  };
  // пусто на экране → какие строки мешают (если сбросить строку — что-то появится)
  const why = () => {const all = items(); return groups.filter(g => S[g.id].size && all.some(d => pass(d, g.id))).map(g => g.title.replace(/:$/, ''))};
  return {pass: d => pass(d), render, why};
}

/* Кнопки «скачать данные» — для другого ИИ (Cowork/ChatGPT): весь файл или только то, что сейчас на экране.
   Файлы лежат на сайте в data/ и пересобираются каждые 30 минут; описание полей — data/README.md. */
function DataLinks(el, name, visibleIds) {
  el.innerHTML = `<div class="m" style="margin:2px 0 8px">⬇ Данные для ИИ: <a href="data/${name}.json" download>всё (JSON)</a> ·
    <a href="data/${name}.xlsx" download>Excel</a> · <a href="#" id="dl-vis">только показанное (JSON)</a> ·
    <a href="data/README.md" target="_blank">что в полях</a></div>`;
  el.querySelector('#dl-vis').onclick = async e => {
    e.preventDefault();
    const all = await (await fetch('data/' + name + '.json', {cache: 'no-store'})).json(), ids = new Set(visibleIds());
    const list = all.items || all.jobs, key = all.items ? 'items' : 'jobs';
    const out = {...all, [key]: list.filter(x => ids.has(x.id)), filtered: true, count: ids.size};
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(out, null, 1)], {type: 'application/json'}));
    a.download = `${name}_показанное_${new Date().toISOString().slice(0, 10)}.json`; a.click();
  };
}

  if(!prev){el.innerHTML='<div class="news">Первый заход: дальше новые вакансии будут в жёлтой рамке.</div>';return}
  const n=JOBS.filter(d=>isNew(d)&&!d.ausb).length,g=JOBS.filter(isNewGone).length;
  el.innerHTML=(n||g)?`<div class="news"><button onclick="store.set('lastVisit',nowLocal());location.reload()">прочитано</button>С прошлого захода: <b>${n} новых</b>, закрыто ${g}.</div>`:'';
}
function draw(){
  Object.values(markers).forEach(m=>map.removeLayer(m));
  const list=document.getElementById('list');list.innerHTML='';
  const vis=JOBS.filter(visible).sort((a,b)=>(isNew(b)-isNew(a))||(days(a)-days(b)));
  const by={};vis.forEach(d=>(by[d.ort]=by[d.ort]||[]).push(d));
  if(!vis.length){const w=F.why();list.innerHTML=`<div class="m" style="padding:20px 0">По этим фильтрам ничего нет.${w.length?' Мешает строка: <b>'+w.join(', ')+'</b> — нажми там «все».':''}</div>`}
  Object.entries(by).sort((a,b)=>a[1][0].km-b[1][0].km).forEach(([city,arr])=>{
    list.insertAdjacentHTML('beforeend',`<div class="city">${esc(city)} · ${arr[0].km} км · ${arr.length}</div>`);
    arr.forEach(d=>{
      const nw=isNew(d),mk=marks[d.id],gone=isGone(d);
      const m=L.marker([d._lat,d._lon],{icon:L.divIcon({className:'',html:`<div class="pin${nw?' isnew':''}${selId===d.id?' sel':''}" style="background:${KCOL[d.kind]};${mk?'opacity:.55':''}">${mk?ST[mk].i:'👩‍🏫'}</div>`})}).addTo(map);
      m.bindTooltip(`${esc(d.title)}<br><small>${esc(d.firma)}</small>`);m.on('click',()=>select(d.id));markers[d.id]=m;
      const el=document.createElement('div');el.id='c'+d.id;
      el.className='c'+(nw?' isnew':'')+(gone?' gone':'')+(HIDE.includes(mk)?' done':'')+(selId===d.id?' sel':'');
      el.innerHTML=`<div class="ti"><span class="dot" style="background:${KCOL[d.kind]}"></span> ${esc(d.title)}${nw?'<span class="tag">новое</span>':''}${gone?'<span class="tag">закрыта</span>':''}${mk?`<span class="st st-${mk.replace(' ','')}">${ST[mk].i} ${ST[mk].b}</span>`:''}</div>
        <div class="fi">${esc(d.firma)}</div>
        <div class="m">${esc(d.street?d.street+', ':'')}${esc(d.ort)} · ${d.km} км${d.approx?' · 📍 точка = центр города':''}</div>
        <div class="m"><span class="age${days(d)<=0?' fresh':''}">${ago(d)}</span>${d.zeit?' · '+esc(d.zeit):''}${d.befristet?' · befristet':''}${d.quer?' · подходит без профильного образования':''}${d.ausb?' · 🎓 Ausbildung/Praktikum':''} · ${d.kind} · ${d.src}${d.also&&d.also.length?` <b title="та же вакансия на других сайтах — показана один раз">+${d.also.length} копии</b>`:''}</div>
        ${d.desc?`<div class="m" style="margin-top:3px">${esc(d.desc.slice(0,200))}…</div>`:''}
        <div class="acts">${gone?'':Object.keys(ST).map(k=>`<button data-m="${k}" class="${mk===k?'on':''}">${ST[k].i} ${mk===k&&HIDE.includes(k)?'вернуть':ST[k].b}</button>`).join('')}<a href="${d.url}" target="_blank" style="font-size:12px">вакансия →</a>${(d.also||[]).map(x=>` <a href="${x.url}" target="_blank" style="font-size:12px;color:var(--mute)">ещё на ${esc(x.src)}</a>`).join('')}</div>`;
      el.onclick=e=>{const b=e.target.closest('button');if(b){setMark(d.id,b.dataset.m);return}if(e.target.closest('a'))return;select(d.id,{scroll:false})};
      list.appendChild(el);
    });
  });
  F.render();
}
if(!prev)store.set('lastVisit',nowLocal());
news();draw();pull();if(useSync)setInterval(pull,60000);
</script></body></html>
