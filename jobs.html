  selId=id;const d=JOBS.find(x=>x.id===id);if(!d)return;
  document.querySelectorAll('.c.sel,.pin.sel').forEach(e=>e.classList.remove('sel'));
  const el=document.getElementById('c'+id);if(el){el.classList.add('sel');if(scroll)el.scrollIntoView({behavior:'smooth',block:'center'})}
  const pin=markers[id]?.getElement()?.querySelector('.pin');if(pin)pin.classList.add('sel');
  map.panTo([d._lat,d._lon]);
}
function setMark(id,m){marks[id]=marks[id]===m?undefined:m;if(!marks[id])delete marks[id];push(id);draw()}
function visible(d){return on[d.kind]&&(!d.ausb||opt.ausb)&&(!isGone(d)||opt.gone||isNewGone(d))&&(!HIDE.includes(marks[d.id])||opt[marks[d.id]])&&ageOk(d)}
function news(){
  const el=document.getElementById('news');
  if(!prev){el.innerHTML='<div class="news">Первый заход: дальше новые вакансии будут в жёлтой рамке.</div>';return}
  const n=JOBS.filter(d=>isNew(d)&&!d.ausb).length,g=JOBS.filter(isNewGone).length;
  el.innerHTML=(n||g)?`<div class="news"><button onclick="store.set('lastVisit',nowLocal());location.reload()">прочитано</button>С прошлого захода: <b>${n} новых</b>, закрыто ${g}.</div>`:'';
}
function draw(){
  Object.values(markers).forEach(m=>map.removeLayer(m));
  const list=document.getElementById('list');list.innerHTML='';
  const vis=JOBS.filter(visible).sort((a,b)=>(isNew(b)-isNew(a))||(days(a)-days(b)));
  const by={};vis.forEach(d=>(by[d.ort]=by[d.ort]||[]).push(d));
  if(!vis.length)list.innerHTML='<div class="m" style="padding:20px 0">По этим фильтрам ничего нет.</div>';
  Object.entries(by).sort((a,b)=>a[1][0].km-b[1][0].km).forEach(([city,arr])=>{
    list.insertAdjacentHTML('beforeend',`<div class="city">${esc(city)} · ${arr[0].km} км · ${arr.length}</div>`);
    arr.forEach(d=>{
      const nw=isNew(d),mk=marks[d.id],gone=isGone(d);
      const m=L.marker([d._lat,d._lon],{icon:L.divIcon({className:'',html:`<div class="pin${nw?' isnew':''}${selId===d.id?' sel':''}" style="background:${KCOL[d.kind]};${mk?'opacity:.55':''}">${mk?ST[mk].i:'👩‍🏫'}</div>`})}).addTo(map);
      m.bindTooltip(`${esc(d.title)}<br><small>${esc(d.firma)}</small>`);m.on('click',()=>select(d.id));markers[d.id]=m;
      const el=document.createElement('div');el.id='c'+d.id;
      el.className='c'+(nw?' isnew':'')+(gone?' gone':'')+(HIDE.includes(mk)?' done':'')+(selId===d.id?' sel':'');
      el.innerHTML=`<div class="ti"><span class="dot" style="background:${KCOL[d.kind]}"></span> ${esc(d.title)}${nw?'<span class="tag">новое</span>':''}${gone?'<span class="tag">закрыта</span>':''}${mk?`<span class="st st-${mk.replace(' ','')}">${ST[mk].i} ${ST[mk].b}</span>`:''}</div>
        <div class="fi">${esc(d.firma)}</div>
        <div class="m">${esc(d.street?d.street+', ':'')}${esc(d.ort)} · ${d.km} км${d.approx?' · 📍 точка = центр города':''}</div>
        <div class="m"><span class="age${days(d)<=0?' fresh':''}">${ago(d)}</span>${d.zeit?' · '+esc(d.zeit):''}${d.befristet?' · befristet':''}${d.quer?' · подходит без профильного образования':''}${d.ausb?' · 🎓 Ausbildung/Praktikum':''} · ${d.kind} · ${d.src}</div>
        ${d.desc?`<div class="m" style="margin-top:3px">${esc(d.desc.slice(0,200))}…</div>`:''}
        <div class="acts">${gone?'':Object.keys(ST).map(k=>`<button data-m="${k}" class="${mk===k?'on':''}">${ST[k].i} ${mk===k&&HIDE.includes(k)?'вернуть':ST[k].b}</button>`).join('')}<a href="${d.url}" target="_blank" style="font-size:12px">вакансия →</a></div>`;
      el.onclick=e=>{const b=e.target.closest('button');if(b){setMark(d.id,b.dataset.m);return}if(e.target.closest('a'))return;select(d.id,{scroll:false})};
      list.appendChild(el);
    });
  });
  document.querySelectorAll('#df button').forEach(b=>{b.classList.toggle('on',b.dataset.a===age);
    const s=age;age=b.dataset.a;b.querySelector('i').textContent=JOBS.filter(visible).length;age=s});
  HIDE.forEach(k=>{const e=document.getElementById('cnt-'+k.replace(' ',''));if(e)e.textContent=JOBS.filter(d=>marks[d.id]===k).length});
}
const f=document.getElementById('f');
Object.keys(KCOL).forEach(k=>f.insertAdjacentHTML('beforeend',`<label><input type="checkbox" data-k="${k}" ${on[k]?'checked':''}><span class="dot" style="background:${KCOL[k]}"></span>${k} ${JOBS.filter(d=>d.kind===k&&!isGone(d)).length}</label>`));
[['ausb','🎓 Ausbildung/Praktikum',JOBS.filter(d=>d.ausb&&!isGone(d)).length],['gone','закрытые',JOBS.filter(isGone).length]].forEach(([k,t,n])=>
  f.insertAdjacentHTML('beforeend',`<label><input type="checkbox" data-o="${k}" ${opt[k]?'checked':''}>${t} ${n}</label>`));
HIDE.forEach(k=>f.insertAdjacentHTML('beforeend',`<label><input type="checkbox" data-o="${k}" ${opt[k]?'checked':''}>${ST[k].i} ${ST[k].b} <span id="cnt-${k.replace(' ','')}">0</span></label>`));
f.onchange=e=>{const t=e.target;if(t.dataset.k){on[t.dataset.k]=t.checked?1:0;store.set('kinds',on)}else{opt[t.dataset.o]=t.checked?1:0;store.set('opt',opt)}draw()};
const df=document.getElementById('df');
df.innerHTML='<span>Выставлено:</span>'+Object.keys(AGES).map(a=>`<button data-a="${a}">${a} <i></i></button>`).join('');
df.onclick=e=>{const b=e.target.closest('button');if(!b)return;age=b.dataset.a;store.set('age',age);draw()};
if(!prev)store.set('lastVisit',nowLocal());
news();draw();pull();if(useSync)setInterval(pull,60000);
</script></body></html>
