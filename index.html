<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d1d1f;--mute:#6b6b70;--line:#e3e1dc;--new:#ffd54f;--sel:#2962ff}

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 -apple-system,system-ui,sans-serif}
.wrap{display:grid;grid-template-columns:1fr 470px;height:100vh}
#map{height:100%}
aside{overflow:auto;border-left:1px solid var(--line);padding:14px}

.f{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.f label{border:1px solid var(--line);border-radius:20px;padding:3px 10px;cursor:pointer;font-size:12px;display:flex;gap:5px;align-items:center;background:var(--card)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}

.c:hover{border-color:var(--mute)}.c.isnew{border:2px solid var(--new)}.c.gone{opacity:.5}.c.gone b{text-decoration:line-through}
.c.sel{border:2px solid var(--sel);box-shadow:0 0 0 3px color-mix(in srgb,var(--sel) 25%,transparent)}
.c.done{opacity:.6}
.c img{width:84px;height:64px;object-fit:cover;border-radius:6px;flex:none;background:var(--line)}
.c .body{min-width:0;flex:1}
.pr{font-size:15px}.pr .k{color:var(--mute)}.pr b{font-size:16px}
.t{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.n{font-size:11px;color:var(--mute);font-style:italic}.tag{background:var(--new);color:#000;border-radius:4px;padding:0 5px;font-size:11px;margin-left:4px;font-style:normal}
.tr{font-size:12px;margin-top:2px}
.acts{margin-top:5px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}.acts button{font-size:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:2px 8px;cursor:pointer}
.acts button.on{background:var(--ink);color:var(--bg)}
.city{font-weight:600;margin:14px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute)}
.pin{border-radius:14px;color:#000;font-weight:700;font-size:12px;padding:2px 6px;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);white-space:nowrap}
.pin small{font-weight:400;opacity:.75}.pin.isnew{border-color:#ffb300;border-width:3px}.pin.sel{outline:3px solid var(--sel);transform:scale(1.15)}
.leaflet-popup-content img{width:220px;border-radius:6px}
#route{position:absolute;z-index:1000;left:12px;bottom:24px;max-width:380px;background:var(--card);color:var(--ink);border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.25);padding:12px 14px;font-size:13px;display:none;max-height:45vh;overflow:auto}
#route h3{margin:0 0 6px;font-size:14px}#route .x{float:right;cursor:pointer;border:0;background:none;color:var(--mute);font-size:18px;line-height:1}

.leg .ln{font-weight:700;border-radius:4px;padding:0 5px;color:#fff;font-size:12px}
.mapwrap{position:relative}

const SYNC=''; // адрес общего хранилища отметок; пусто — отметки только на этом устройстве

const prev=store.get('lastVisit',null);

async function pull(){if(!useSync)return;try{const r=await fetch(SYNC,{cache:'no-store'});if(r.ok){const j=await r.json();marks=j.marks||{};store.set('marks',marks);draw()}}catch(_){}}
async function push(){store.set('marks',marks);if(!useSync)return;
  try{const r=await fetch(SYNC,{cache:'no-store'});const j=r.ok?await r.json():{};const cur=j.marks||{};
    Object.keys(marks).forEach(k=>cur[k]=marks[k]);Object.keys(cur).forEach(k=>{if(!marks[k])delete cur[k]});
    await fetch(SYNC,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({marks:cur})})}catch(_){}}
document.getElementById('syncinfo').textContent=useSync?'отметки общие для всех, у кого есть ссылка':'отметки сохраняются только на этом устройстве';

const map=L.map('map').setView(HS,11);

L.control.layers(null,{'🚆 Железная дорога':rail},{collapsed:false}).addTo(map);
map.on('overlayadd overlayremove',e=>store.set('rail',map.hasLayer(rail)?1:0));
L.circle(HS,{radius:12000,color:'#555',weight:1,dashArray:'5 6',fill:false}).addTo(map);
L.marker(HS,{icon:L.divIcon({html:'<div class="pin" style="background:#fff">🎓 Hochschule</div>',className:''})}).addTo(map);
const kalt=d=>d.kalt?Math.round(d.kalt)+' €':'—';
const warm=d=>d.warm_calc?(d.warm_est?'≈':'')+Math.round(d.warm_calc)+' €':'?';
const bike=d=>d.km?Math.round(d.km*1.3/16*60):null;
const trShort=d=>{const r=d.route;let s=r?`🚆 ${r.min} мин · ${r.changes?r.changes+' пересад.':'без пересадок'}`:'🚆 маршрут не найден';if(bike(d))s+=` · 🚲 ~${bike(d)} мин`;return s};
const markers={};const routeLayer=L.layerGroup().addTo(map);
const LCOL=m=>/bahn|RE|RB|S-Bahn|Zug/i.test(m)?'#c62828':/Stadtbus/i.test(m)?'#1565c0':'#6a1b9a';
const icon=l=>l.walk?'🚶':/bahn|Zug/i.test(l.mode)?'🚆':'🚌';

function showRoute(d){
  routeLayer.clearLayers();const box=document.getElementById('route');
  const gmaps=`https://www.google.com/maps/dir/?api=1&origin=${d.lat},${d.lon}&destination=Hochschule+Offenburg&travelmode=transit`;
  if(!d.route){box.style.display='block';box.innerHTML=`<button class="x" onclick="hideRoute()">×</button><h3>${d.ort}</h3>Маршрут не посчитался. <a href="${gmaps}" target="_blank">Открыть в Google Maps →</a>`;return}
  const pts=[];
  d.route.legs.forEach(l=>{if(!l.coords.length)return;
    L.polyline(l.coords,l.walk?{color:'#555',weight:4,dashArray:'2 8'}:{color:LCOL(l.mode),weight:6,opacity:.85}).addTo(routeLayer);
    if(!l.walk){L.circleMarker(l.coords[0],{radius:6,color:'#fff',weight:2,fillColor:LCOL(l.mode),fillOpacity:1}).bindTooltip(`${l.dep} ${l.from}<br>${icon(l)} ${l.line}`).addTo(routeLayer);
      L.circleMarker(l.coords[l.coords.length-1],{radius:6,color:'#fff',weight:2,fillColor:LCOL(l.mode),fillOpacity:1}).bindTooltip(`${l.arr} ${l.to}`).addTo(routeLayer)}
    pts.push(...l.coords)});
  if(pts.length)map.fitBounds(L.latLngBounds(pts).pad(.15));
  box.style.display='block';
  box.innerHTML=`<button class="x" onclick="hideRoute()">×</button><h3>${d.ort} → Hochschule</h3>
    <div><b>${d.route.min} мин</b> · ${d.route.changes?d.route.changes+' пересадк'+(d.route.changes==1?'а':'и'):'без пересадок'} · выход ${d.route.dep}, на месте ${d.route.arr}${bike(d)?` · на велике ~${bike(d)} мин`:''}</div>`+
    d.route.legs.map(l=>`<div class="leg"><span class="ic">${icon(l)}</span><div>${l.walk?`пешком ${l.min} мин`:`<span class="ln" style="background:${LCOL(l.mode)}">${l.line}</span> ${l.mode}`}<br><span style="color:var(--mute)">${l.dep} ${l.from} → ${l.arr} ${l.to}</span></div></div>`).join('')+
    `<div style="margin-top:6px;font-size:12px"><a href="${gmaps}" target="_blank">другие варианты в Google Maps →</a></div>`;
}
function hideRoute(){routeLayer.clearLayers();document.getElementById('route').style.display='none'}

function select(id,{scroll=true,pan=false}={}){
  selId=id;const d=ADS.find(x=>x.id===id);if(!d)return;
  document.querySelectorAll('.c.sel').forEach(e=>e.classList.remove('sel'));
  document.querySelectorAll('.pin.sel').forEach(e=>e.classList.remove('sel'));
  const el=document.getElementById('c'+id);if(el){el.classList.add('sel');if(scroll)el.scrollIntoView({behavior:'smooth',block:'center'})}
  const pin=markers[id]?.getElement()?.querySelector('.pin');if(pin)pin.classList.add('sel');
  showRoute(d);
}
function setMark(id,m){marks[id]=marks[id]===m?undefined:m;if(!marks[id])delete marks[id];push();draw();if(selId===id&&marks[id]!=='не интересно')select(id,{scroll:false})}

function news(){
  const vis=d=>marks[d.id]!=='не интересно';
  const n=ADS.filter(d=>isNew(d)&&vis(d)&&['отлично','норм','проверить'].includes(d.verdict)).length, all=ADS.filter(d=>isNew(d)&&vis(d)).length, g=ADS.filter(isNewGone).length;
  const el=document.getElementById('news');
  if(!prev){el.innerHTML='<div class="news">Первый заход: с этого момента будут подсвечиваться новые объявления.</div>';return}
  el.innerHTML=(all||g)?`<div class="news"><button onclick="store.set('lastVisit',nowLocal());location.reload()">прочитано</button>С прошлого захода: <b>${all} новых</b> (подходящих ${n}), удалено ${g}. Новые — в жёлтой рамке.</div>`:'';
}
function draw(){
  Object.values(markers).forEach(m=>map.removeLayer(m));
  const list=document.getElementById('list');list.innerHTML='';
  const vis=ADS.filter(d=>(on[d.verdict]||isNewGone(d))&&(showHidden||marks[d.id]!=='не интересно'));
  vis.sort((a,b)=>(isNew(b)-isNew(a)));
  const byCity={};vis.forEach(d=>(byCity[d.ort]=byCity[d.ort]||[]).push(d));
  Object.entries(byCity).sort((a,b)=>(a[1][0].km||99)-(b[1][0].km||99)).forEach(([city,arr])=>{
    list.insertAdjacentHTML('beforeend',`<div class="city">${city} · ${arr[0].km} км · ${arr.length}</div>`);
    arr.forEach(d=>{
      const nw=isNew(d), mk=marks[d.id], gone=d.verdict==='удалено';
      const m=L.marker([d.lat,d.lon],{icon:L.divIcon({className:'',html:`<div class="pin${nw?' isnew':''}${selId===d.id?' sel':''}" style="background:${COL[d.verdict]};${mk?'opacity:.5':''}">${mk==='написали'?'✉️ ':''}<small>${kalt(d)} →</small> ${warm(d)}</div>`})}).addTo(map);
      m.on('click',()=>select(d.id));
      markers[d.id]=m;
      const el=document.createElement('div');el.id='c'+d.id;
      el.className='c'+(nw?' isnew':'')+(gone?' gone':'')+(mk?' done':'')+(selId===d.id?' sel':'');
      el.innerHTML=`<img src="${d.img||''}" loading="lazy"><div class="body">
        <div class="pr"><span class="dot" style="background:${COL[d.verdict]}"></span> <span class="k">${kalt(d)} холодн. →</span> <b>${warm(d)}</b> тёпл.${nw?'<span class="tag">новое</span>':''}${isNewGone(d)?'<span class="tag">удалено</span>':''}</div>
        <div>${d.m2||'?'} м² · ${d.zimmer||'?'} комн. ${d.moebl?'· 🛋 мебель':''} ${d.ebk?'· 🍳 кухня':''}</div>
        <div class="tr">${trShort(d)}</div>
        <div class="t">${d.title}</div>
        <div class="n">${d.verdict}${d.eur_m2?` · ${d.eur_m2} €/м²`:''}${d.notes.length?' · '+d.notes.join('; '):''}${d.ab?' · с '+d.ab:''}${d.source==='наш список'?' · ⭐ наш список':''}</div>
        <div class="acts">${gone?'':`<button data-m="написали" class="${mk==='написали'?'on':''}">✉️ написали</button><button data-m="не интересно" class="${mk==='не интересно'?'on':''}">${mk==='не интересно'?'↩︎ вернуть':'✕ не интересно'}</button>`}<a href="${d.url}" target="_blank" style="font-size:12px">объявление →</a></div></div>`;
      el.onclick=e=>{
        const b=e.target.closest('button');if(b){setMark(d.id,b.dataset.m);return}
        if(e.target.closest('a'))return;
        select(d.id,{scroll:false})};
      list.appendChild(el);

  });
  const h=Object.values(marks).filter(v=>v==='не интересно').length;
  document.getElementById('hidcnt').textContent=h;
}
const f=document.getElementById('f');
Object.keys(COL).forEach(v=>{const n=ADS.filter(d=>d.verdict===v).length;
  f.insertAdjacentHTML('beforeend',`<label><input type="checkbox" data-v="${v}" ${on[v]?'checked':''}><span class="dot" style="background:${COL[v]}"></span>${v} ${n}</label>`)});
f.insertAdjacentHTML('beforeend',`<label><input type="checkbox" id="showhid">✕ скрытые <span id="hidcnt">0</span></label>`);
f.onchange=e=>{if(e.target.id==='showhid'){showHidden=e.target.checked}else{on[e.target.dataset.v]=e.target.checked?1:0;store.set('wv',on)}draw()};
if(!prev)store.set('lastVisit',nowLocal());
news();draw();pull();
</script></body></html>
