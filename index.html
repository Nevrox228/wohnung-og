        <div class="pr"><span class="dot" style="background:${COL[d.verdict]}"></span> <span class="k">${kalt(d)} холодн. →</span> <b>${warm(d)}</b> тёпл.${nw?'<span class="tag">новое</span>':''}${isNewGone(d)?'<span class="tag">удалено</span>':''}${mk?`<span class="st st-${mk.replace(' ','')}">${ST[mk].i} ${mk}</span>`:''}</div>
        <div>${d.m2||'?'} м² · ${d.zimmer||'?'} комн. ${d.moebl?'· 🛋 мебель':''} ${d.ebk?'· 🍳 кухня':''}</div>
        <div class="age${days(d)===0?' fresh':''}">${ago(d)}</div>
        <div class="tr">${trShort(d)}</div>
        <div class="t">${d.title}</div>
        <div class="n">${d.verdict}${d.eur_m2?` · ${d.eur_m2} €/м²`:''}${d.notes.length?' · '+d.notes.join('; '):''}${d.ab?' · с '+d.ab:''}${d.source==='наш список'?' · ⭐ наш список':''}${approx?' · 📍 адрес примерный':''}</div>
        <div class="acts">${gone?'':Object.keys(ST).map(k=>`<button data-m="${k}" class="${mk===k?'on':''}">${ST[k].i} ${mk===k&&HIDE.includes(k)?'вернуть':ST[k].b}</button>`).join('')}${gone?'':'<button data-b="1">✍️ письмо</button>'}<a href="${d.url}" target="_blank" style="font-size:12px">объявление →</a></div></div>`;
      el.onclick=e=>{
        const b=e.target.closest('button');if(b){b.dataset.b?openBrief(d):setMark(d.id,b.dataset.m);return}
        if(e.target.closest('a'))return;
        select(d.id,{scroll:false})};
      list.appendChild(el);
    });
  });
  HIDE.forEach(k=>{const e=document.getElementById('cnt-'+k.replace(' ',''));if(e)e.textContent=Object.values(marks).filter(v=>v===k).length});
  document.querySelectorAll('#df button').forEach(b=>{b.classList.toggle('on',b.dataset.a===age);
    const n=ADS.filter(d=>{const s=age;age=b.dataset.a;const r=ageOk(d)&&d.verdict!=='удалено'&&!HIDE.includes(marks[d.id]);age=s;return r}).length;b.querySelector('i').textContent=n});
}
const f=document.getElementById('f');
Object.keys(COL).forEach(v=>{const n=ADS.filter(d=>d.verdict===v).length;
  f.insertAdjacentHTML('beforeend',`<label><input type="checkbox" data-v="${v}" ${on[v]?'checked':''}><span class="dot" style="background:${COL[v]}"></span>${v} ${n}</label>`)});
HIDE.forEach(k=>f.insertAdjacentHTML('beforeend',`<label><input type="checkbox" data-s="${k}" ${showSt[k]?'checked':''}>${ST[k].i} ${k} <span id="cnt-${k.replace(' ','')}">0</span></label>`));
f.onchange=e=>{const t=e.target;if(t.dataset.s){showSt[t.dataset.s]=t.checked?1:0;store.set('showSt',showSt)}else{on[t.dataset.v]=t.checked?1:0;store.set('wv',on)}draw()};
const df=document.getElementById('df');
df.innerHTML='<span>Выставлено:</span>'+Object.keys(AGES).map(a=>`<button data-a="${a}">${a} <i></i></button>`).join('');
df.onclick=e=>{const b=e.target.closest('button');if(!b)return;age=b.dataset.a;store.set('age',age);draw()};
if(!prev)store.set('lastVisit',nowLocal());
news();draw();pull();if(useSync)setInterval(pull,60000);

// ---- первое письмо арендодателю: шаблон без ИИ, всё подставляется в браузере ----
const BRIEF={ueber:'Wir sind ein junges Paar und suchen eine gemeinsame Wohnung in Offenburg und Umgebung, da Mykyta an der Hochschule Offenburg studiert.',sig:'Olga Malachov',tel:''};
let briefAd=null;
function briefCfg(){return Object.assign({},BRIEF,store.get('brief',{}))}
function deDate(v){const[y,m,d]=v.split('-');return `${d}.${m}.${y}`}
function briefText(){
  const c=briefCfg(),an=$b('bAn').value,n=$b('bName').value.trim(),ab=$b('bAb').value,d=briefAd;
  const anrede=an&&n?(an==='Herr'?'Sehr geehrter Herr ':'Sehr geehrte Frau ')+n+',':'Sehr geehrte Damen und Herren,';
  const st=(d.street||'').replace(/,\s*$/,''),wo=/(straße|str\.|gasse|allee)\s*\d+\w?$/i.test(st)?` in der ${st}${d.ort?' in '+d.ort:''}`:(d.ort?` in ${d.ort}`:'');
  return `${anrede}

mit großem Interesse haben wir Ihre Anzeige „${d.title}“${wo} gelesen. Die Wohnung gefällt uns sehr gut, und wir würden sie gerne besichtigen.

${c.ueber}

Einziehen könnten wir ${ab?'ab dem '+deDate(ab):'ab sofort bzw. nach Absprache'}. Für eine Besichtigung sind wir zeitlich flexibel und können auch kurzfristig vorbeikommen.

Über eine Rückmeldung würden wir uns sehr freuen.

Herzliche Grüße
${c.sig}${c.tel?'\nTel.: '+c.tel:''}`}
function $b(id){return document.getElementById(id)}
function briefFill(){$b('bText').value=briefText()}
function openBrief(d){
  briefAd=d;const c=briefCfg(),last=store.get('briefLast',{});
  $b('bAn').value=last.an??'Frau';$b('bName').value='';$b('bAb').value=last.ab||'';
  $b('bUeber').value=c.ueber;$b('bSig').value=c.sig;$b('bTel').value=c.tel;$b('bOk').textContent='';
  $b('bMark').style.display=marks[d.id]==='написали'?'none':'';
  briefFill();$b('brief').style.display='flex';$b('bName').focus()}
function closeBrief(){$b('brief').style.display='none'}
async function copyBrief(){
  const s=$b('bText').value;
  try{await navigator.clipboard.writeText(s)}catch(_){const t=$b('bText');t.select();document.execCommand('copy')}
  $b('bOk').textContent='✓ скопировано — вставь в Kleinanzeigen'}
['bAn','bName','bAb'].forEach(id=>$b(id).addEventListener('input',()=>{store.set('briefLast',{an:$b('bAn').value,ab:$b('bAb').value});briefFill()}));
['bUeber','bSig','bTel'].forEach(id=>$b(id).addEventListener('input',()=>{store.set('brief',{ueber:$b('bUeber').value,sig:$b('bSig').value,tel:$b('bTel').value});briefFill()}));
$b('bMark').onclick=()=>{if(marks[briefAd.id]!=='написали')setMark(briefAd.id,'написали');$b('bMark').style.display='none';$b('bOk').textContent='✓ отмечено «написали»'};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeBrief()});
</script></body></html>
