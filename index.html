<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Квартира Оффенбург</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d1d1f;--mute:#6b6b70;--line:#e3e1dc;--new:#ffd54f}
@media (prefers-color-scheme:dark){:root{--bg:#161618;--card:#222226;--ink:#eee;--mute:#9a9aa0;--line:#333338}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 -apple-system,system-ui,sans-serif}
.wrap{display:grid;grid-template-columns:1fr 460px;height:100vh}
#map{height:100%}
aside{overflow:auto;border-left:1px solid var(--line);padding:14px}
h1{font-size:18px;margin:0 0 2px}.sub{color:var(--mute);font-size:12px;margin-bottom:10px}
.news{background:var(--new);color:#000;border-radius:10px;padding:8px 12px;margin-bottom:10px;font-size:13px}
.news button{float:right;border:0;background:#000;color:#fff;border-radius:6px;padding:2px 8px;cursor:pointer;font-size:12px}
.f{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.f label{border:1px solid var(--line);border-radius:20px;padding:3px 10px;cursor:pointer;font-size:12px;display:flex;gap:5px;align-items:center;background:var(--card)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.c{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;display:flex;gap:10px;cursor:pointer}
.c:hover{border-color:var(--mute)}.c.isnew{border:2px solid var(--new)}.c.gone{opacity:.5}.c.gone b{text-decoration:line-through}
.c img{width:84px;height:64px;object-fit:cover;border-radius:6px;flex:none;background:var(--line)}
.c .body{min-width:0;flex:1}
.pr{font-size:15px}.pr .k{color:var(--mute)}.pr b{font-size:16px}
.t{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.n{font-size:11px;color:var(--mute);font-style:italic}.tag{background:var(--new);color:#000;border-radius:4px;padding:0 5px;font-size:11px;margin-left:4px;font-style:normal}
.acts{margin-top:4px;display:flex;gap:6px}.acts button{font-size:11px;border:1px solid var(--line);background:none;color:var(--ink);border-radius:6px;padding:1px 7px;cursor:pointer}
.acts button.on{background:var(--ink);color:var(--bg)}
.city{font-weight:600;margin:14px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute)}
.pin{border-radius:14px;color:#000;font-weight:700;font-size:12px;padding:2px 6px;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);white-space:nowrap}
.pin small{font-weight:400;opacity:.75}.pin.isnew{border-color:#ffb300;border-width:3px}
.leaflet-popup-content img{width:220px;border-radius:6px}
@media (max-width:800px){.wrap{grid-template-columns:1fr;grid-template-rows:50vh auto;height:auto}aside{border:0;padding:12px 16px}}
</style></head><body>

026", "img": "https://img.kleinanzeigen.de/api/v1/prod-ads/images/2c/2cf44e03-0a8c-44ab-945b-eaeb73558041?rule=$_59.JPG", "source": "поиск", "first_seen": "2026-10-31", "gone_at": null, "eur_m2": 10.5, "allowed": 1000, "kaution": 1000.0, "zone": "далеко"}], COL={"отлично": "#1a9850", "норм": "#91cf60", "проверить": "#fdae61", "далеко": "#8c8cff", "дорого": "#f46d43", "нет": "#9e9e9e", "удалено": "#444444"}, HS=[48.4588, 7.944];
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(_){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(_){}}};
// прошлый заход: всё, что появилось/удалилось позже, — «новое для тебя»
const nowLocal=()=>{const t=new Date();t.setMinutes(t.getMinutes()-t.getTimezoneOffset());return t.toISOString().slice(0,16)};
const prev=store.get('lastVisit',null);
const isNew=d=>prev&&d.first_seen>prev&&d.verdict!=='удалено';
const isNewGone=d=>prev&&d.gone_at&&d.gone_at>prev;
let marks=store.get('marks',{}); // id → 'написали' | 'не интересно'
let on=store.get('wv',null)||{отлично:1,норм:1,проверить:1,далеко:1,дорого:1,нет:0,удалено:0};
const map=L.map('map').setView(HS,11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:18}).addTo(map);
L.circle(HS,{radius:12000,color:'#555',weight:1,dashArray:'5 6',fill:false}).addTo(map);
L.marker(HS,{icon:L.divIcon({html:'<div class="pin" style="background:#fff">🎓 Hochschule</div>',className:''})}).addTo(map);
const kalt=d=>d.kalt?Math.round(d.kalt)+' €':'—';
const warm=d=>d.warm_calc?(d.warm_est?'≈':'')+Math.round(d.warm_calc)+' €':'?';
const markers={};
function news(){
  const n=ADS.filter(d=>isNew(d)&&['отлично','норм','проверить'].includes(d.verdict)).length, all=ADS.filter(isNew).length, g=ADS.filter(isNewGone).length;
  const el=document.getElementById('news');
  if(!prev){el.innerHTML='<div class="news">Первый заход: с этого момента будут подсвечиваться новые объявления.</div>';return}
  el.innerHTML=(all||g)?`<div class="news"><button onclick="store.set('lastVisit',nowLocal());location.reload()">прочитано</button>С прошлого захода: <b>${all} новых</b> (подходящих ${n}), удалено ${g}. Новые — в жёлтой рамке.</div>`:'';
}
function draw(){
  Object.values(markers).forEach(m=>map.removeLayer(m));
  const list=document.getElementById('list');list.innerHTML='';
  const vis=ADS.filter(d=>on[d.verdict]||isNewGone(d));
  vis.sort((a,b)=>(isNew(b)-isNew(a)));
  const byCity={};vis.forEach(d=>(byCity[d.ort]=byCity[d.ort]||[]).push(d));
  Object.entries(byCity).sort((a,b)=>(a[1][0].km||99)-(b[1][0].km||99)).forEach(([city,arr])=>{
    list.insertAdjacentHTML('beforeend',`<div class="city">${city} · ${arr[0].km} км · ${arr.length}</div>`);
    arr.forEach(d=>{
      const nw=isNew(d), mk=marks[d.id], gone=d.verdict==='удалено';
      const m=L.marker([d.lat,d.lon],{icon:L.divIcon({className:'',html:`<div class="pin${nw?' isnew':''}" style="background:${COL[d.verdict]};${mk?'opacity:.55':''}"><small>${kalt(d)} →</small> ${warm(d)}</div>`})})
        .bindPopup(`${d.img?`<img src="${d.img}">`:''}<br>холодная <b>${kalt(d)}</b> → тёплая <b>${warm(d)}</b>${d.nk?` (NK ${Math.round(d.nk)} €)`:''}<br>${d.m2||'?'} м² · ${d.zimmer||'?'} комн.<br>${d.title}<br><i>${d.verdict}${d.notes.length?' — '+d.notes.join('; '):''}</i><br><a href="${d.url}" target="_blank">открыть объявление →</a>`).addTo(map);
      markers[d.id]=m;
      const el=document.createElement('div');el.className='c'+(nw?' isnew':'')+(gone?' gone':'');
      el.innerHTML=`<img src="${d.img||''}" loading="lazy"><div class="body">
        <div class="pr"><span class="dot" style="background:${COL[d.verdict]}"></span> <span class="k">${kalt(d)} холодн. →</span> <b>${warm(d)}</b> тёпл.${nw?'<span class="tag">новое</span>':''}${isNewGone(d)?'<span class="tag">удалено</span>':''}</div>
        <div>${d.m2||'?'} м² · ${d.zimmer||'?'} комн. ${d.moebl?'· 🛋 мебель':''} ${d.ebk?'· 🍳 кухня':''}</div>
        <div class="t">${d.title}</div>
        <div class="n">${d.verdict}${d.eur_m2?` · ${d.eur_m2} €/м²`:''} · норм. цена ≈${d.allowed} €${d.notes.length?' · '+d.notes.join('; '):''}${d.ab?' · с '+d.ab:''}${d.source==='наш список'?' · ⭐ наш список':''}</div>
        ${gone?'':`<div class="acts"><button data-m="написали" class="${mk==='написали'?'on':''}">✉️ написали</button><button data-m="не интересно" class="${mk==='не интересно'?'on':''}">✕ не интересно</button><a href="${d.url}" target="_blank" style="font-size:11px">открыть →</a></div>`}</div>`;
      el.onclick=e=>{
        const b=e.target.closest('button');
        if(b){marks[d.id]=marks[d.id]===b.dataset.m?undefined:b.dataset.m;store.set('marks',marks);draw();return}
        if(e.target.closest('a'))return;
        map.setView([d.lat,d.lon],14);m.openPopup()};
      list.appendChild(el);
    });
  });
}
const f=document.getElementById('f');
Object.keys(COL).forEach(v=>{const n=ADS.filter(d=>d.verdict===v).length;
  f.insertAdjacentHTML('beforeend',`<label><input type="checkbox" data-v="${v}" ${on[v]?'checked':''}><span class="dot" style="background:${COL[v]}"></span>${v} ${n}</label>`)});
f.onchange=e=>{on[e.target.dataset.v]=e.target.checked?1:0;store.set('wv',on);draw()};
if(!prev)store.set('lastVisit',nowLocal());
news();draw();
</script></body></html>
